<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <title>布里斯班新生节 · 礼品图鉴</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { color: #12213f; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #fdf6ef; }
    .poster { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #fdf6ef url("assets/page-01/brisbane-display-background.png") center / cover no-repeat; }
    .poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(253,246,239,.2), rgba(91,155,255,.025) 50%, rgba(255,107,92,.08)); pointer-events: none; }
    .poster.onsite::after { background: linear-gradient(180deg, rgba(255,225,93,.10), rgba(253,246,239,.02) 46%, rgba(255,107,92,.13)); }
    .header { position: relative; z-index: 2; height: 326px; padding: 44px 58px 20px; }
    .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; }
    .event-logo { width: 286px; height: 124px; object-fit: contain; object-position: left center; filter: drop-shadow(0 8px 18px rgba(18,33,63,.12)); }
    .page-tag { margin-top: 8px; padding: 14px 23px; border: 1px solid rgba(18,33,63,.14); border-radius: 999px; background: rgba(255,255,255,.78); box-shadow: 0 10px 26px rgba(18,33,63,.08); font-size: 25px; font-weight: 800; }
    h1 { margin: 6px 0 8px; font-size: 58px; line-height: 1.05; letter-spacing: -.045em; font-weight: 950; }
    h1 span { color: #ff6b5c; }
    .meta { display: inline-flex; padding: 9px 18px; border-radius: 999px; color: #fff; background: #315f9e; font-size: 23px; font-weight: 760; }
    .grid { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); gap: 28px 30px; height: 1510px; padding: 16px 56px 42px; }
    .grid.seven { grid-template-rows: repeat(4, 1fr); gap: 19px 30px; }
    .card { position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1.5px solid rgba(255,255,255,.94); border-radius: 38px; background: linear-gradient(155deg, rgba(255,255,255,.9), rgba(255,255,255,.68)); box-shadow: 0 22px 54px rgba(18,33,63,.13), inset 0 0 0 1px rgba(18,33,63,.05); backdrop-filter: blur(12px); }
    .card.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; }
    .rank { position: absolute; z-index: 4; top: 18px; left: 20px; display: grid; place-items: center; width: 54px; height: 54px; border-radius: 18px; color: #fff; background: #ff6b5c; box-shadow: 0 10px 22px rgba(255,107,92,.3); font-size: 24px; font-weight: 900; }
    .poster.onsite .rank { background: #315f9e; }
    .photo { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; height: 304px; padding: 35px 35px 8px; }
    .photo img { display: block; max-width: 100%; max-height: 270px; object-fit: contain; filter: drop-shadow(0 18px 18px rgba(18,33,63,.18)); }
    .photo.multi img { max-width: 47%; max-height: 205px; }
    .wide .photo { width: 47%; height: 100%; padding: 18px 20px 15px 90px; }
    .wide .copy { width: 53%; padding: 18px 28px 18px 10px; }
    .grid.seven .card:not(.wide) .photo { height: 230px; padding-top: 28px; }
    .grid.seven .card:not(.wide) .photo img { max-height: 198px; }
    .copy { display: flex; flex: 1; flex-direction: column; justify-content: space-between; gap: 9px; padding: 6px 26px 25px; text-align: center; }
    .name { min-height: 58px; display: grid; place-items: center; font-size: 28px; line-height: 1.16; letter-spacing: -.025em; font-weight: 900; }
    .grid.seven .card:not(.wide) .name { min-height: 40px; font-size: 24px; }
    .sponsor { align-self: center; max-width: 100%; padding: 10px 18px; border-radius: 999px; color: #fff; background: #12213f; font-size: 20px; line-height: 1.15; font-weight: 760; white-space: nowrap; }
    .sponsor.long { font-size: 17px; }
    .placeholder-art { position: relative; width: 155px; height: 155px; border-radius: 46px; background: linear-gradient(145deg, #ffe15d, #ff8f7f); box-shadow: 0 18px 30px rgba(255,107,92,.22); }
    .placeholder-art::before { content: ""; position: absolute; left: 27px; right: 27px; bottom: 25px; height: 73px; border-radius: 15px 15px 27px 27px; background: rgba(255,255,255,.92); }
    .placeholder-art::after { content: ""; position: absolute; left: 56px; top: 27px; width: 43px; height: 43px; border: 10px solid rgba(255,255,255,.92); border-bottom: 0; border-radius: 50px 50px 0 0; }
    .missing { position: absolute; bottom: 3px; width: 100%; color: rgba(18,33,63,.58); text-align: center; font-size: 16px; font-weight: 700; }
    .fine-print { position: absolute; z-index: 4; bottom: 11px; left: 0; width: 100%; color: rgba(18,33,63,.68); text-align: center; font-size: 15px; font-weight: 650; letter-spacing: .03em; }
  </style>
</head>
<body>
  <main id="poster" class="poster">
    <header class="header">
      <div class="header-top"><img class="event-logo" src="assets/page-01/event-logo.png" alt="布里斯班新生节" /><div id="pageTag" class="page-tag"></div></div>
      <h1 id="title"></h1>
      <div id="meta" class="meta"></div>
    </header>
    <section id="grid" class="grid"></section>
    <div class="fine-print">奖品与现场安排以活动页最新信息为准。</div>
  </main>
  <script src="pages-data.js"></script>
  <script>
    const pageNumber = Number(new URLSearchParams(location.search).get('page') || 2);
    const data = window.POSTER_PAGES[pageNumber];
    if (!data) throw new Error(`Unknown page ${pageNumber}`);
    document.getElementById('pageTag').textContent = `礼品图鉴 · ${String(pageNumber).padStart(2, '0')} / 09`;
    document.getElementById('title').textContent = data.title;
    document.getElementById('meta').textContent = data.meta;
    const poster = document.getElementById('poster');
    const grid = document.getElementById('grid');
    if (data.onsite) poster.classList.add('onsite');
    if (data.layout) grid.classList.add(data.layout);
    data.items.forEach((item) => {
      const card = document.createElement('article');
      card.className = `card${item.wide ? ' wide' : ''}`;
      const badge = item.rank || '礼';
      const images = item.images || (item.image ? [item.image] : []);
      const photo = item.placeholder
        ? '<div class="photo"><div class="placeholder-art"></div><div class="missing">准确实物图待补</div></div>'
        : `<div class="photo${images.length > 1 ? ' multi' : ''}">${images.map((src) => `<img src="${src}" alt="${item.name}" />`).join('')}</div>`;
      const sponsorClass = item.sponsor.length > 13 ? 'sponsor long' : 'sponsor';
      card.innerHTML = `<div class="rank">${badge}</div>${photo}<div class="copy"><div class="name">${item.name}</div><div class="${sponsorClass}">由 ${item.sponsor} 提供</div></div>`;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
