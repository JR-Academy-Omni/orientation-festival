<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<title>墨尔本新生节 2027 招商海报 · 活力版合作套餐</title><link rel="stylesheet" href="lively.css">
<style>
  .packs { position: absolute; left: 64px; right: 64px; top: 560px; display: flex; flex-direction: column; gap: 30px; z-index: 6; }
  .pack { display: grid; grid-template-columns: 360px 1fr; background: #fff; border: var(--bd); border-radius: var(--r); overflow: hidden; box-shadow: 8px 8px 0 var(--c), 8px 8px 0 4px #000; }
  .pack .head { background: var(--c); border-right: var(--bd); padding: 22px 28px; display: flex; align-items: center; }
  .pack .name { font-family: var(--head); font-weight: 800; font-size: 40px; }
  .pack .price { font-family: var(--head); font-weight: 900; font-size: 66px; line-height: 1; letter-spacing: -1px; }
  .pack ul { list-style: none; padding: 22px 30px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .pack li { font-size: 32px; font-weight: 800; display: flex; align-items: center; gap: 14px; }
  .pack li::before { content: ""; width: 20px; height: 20px; border-radius: 50%; background: var(--c); border: 3px solid #000; flex: none; }
  .hot { position: absolute; right: -14px; top: -26px; background: var(--yellow); border: var(--bd); border-radius: 999px; padding: 6px 22px; font-weight: 900; font-size: 26px; transform: rotate(6deg); box-shadow: 4px 4px 0 #000; }
</style></head>
<body><main class="poster dots" style="background:var(--cream)">
  <div class="blob" style="left:900px;top:-140px;width:460px;height:460px;background:var(--green)"></div>
  <svg class="confetti" viewBox="0 0 1242 1656">
    <path transform="translate(820 200)" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="var(--yellow)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="1170" cy="470" r="18" fill="var(--red)" stroke="#000" stroke-width="4"/>
    <path transform="translate(40 1260) rotate(10)" d="M0 -20 L20 20 L-20 20 Z" fill="var(--blue)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  </svg>
  <img class="logo" src="../assets/jr-logo-black.svg" alt="匠人学院 JR Academy">

  <div style="position:absolute;left:64px;top:176px;z-index:6">
    <span class="pill mono tilt-l" style="background:var(--dark);color:var(--yellow)">PACKAGES · 3/6 · DRILL HALL</span>
    <div style="display:flex;align-items:flex-end;gap:26px;margin-top:34px">
      <div class="h-big" style="font-size:132px">三档合作</div>
      <div class="sticker h-big" style="font-size:80px;padding:6px 26px 12px;transform:rotate(-5deg);background:var(--purple)">任你选</div>
    </div>
    <svg class="squiggle" width="300" height="30" viewBox="0 0 300 30" style="margin-top:18px"><path d="M5 18 q22 -16 44 0 t44 0 t44 0 t44 0 t44 0 t44 0" fill="none" stroke="var(--red)" stroke-width="9" stroke-linecap="round"/></svg>
  </div>

  <div class="packs">
    <div class="pack" style="--c:var(--blue);transform:rotate(-1deg)">
      <div class="head"><div class="price">Silver</div></div>
      <ul><li>基础线上露出</li><li>展位互动入口</li><li>活动后回顾素材</li></ul>
    </div>
    <div class="pack" style="--c:var(--green);transform:rotate(0.8deg)">
      <div class="head"><div class="price">Gold</div></div>
      <ul><li>多渠道预热宣传</li><li>品牌详细介绍</li><li>社群触达</li></ul>
    </div>
    <div style="position:relative;transform:rotate(-0.8deg)">
      <div class="pack" style="--c:var(--red)">
        <div class="head"><div class="price" style="color:#fff">Diamond</div></div>
        <ul><li>优先选择展位</li><li>主持人现场口播</li><li>活动后数据反馈</li></ul>
      </div>
      <div class="hot">热门</div>
    </div>
  </div>

  <div class="card" style="position:absolute;left:64px;right:64px;top:1290px;background:var(--dark);color:#fff;z-index:6;box-shadow:8px 8px 0 #000;font-size:28px;font-weight:700;line-height:1.5">
    学校 O-week 摊位只覆盖一所大学。<br>这里一个下午，<span style="color:var(--yellow)">三校新生一次逛完</span>。
  </div>

  <div class="cta">
    <div class="big" style="background:var(--red);color:#fff"><div class="t">早鸟优惠</div><div class="n" style="font-size:56px">1 月 15 日前</div></div>
    <div class="contact"><div class="k">套餐详情 · ANGELA HAN</div><div class="p">+61 452 263 727</div><div class="e">angela727hl@gmail.com</div></div>
  </div>
</main></body></html>
